<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <title>PsicopeApp</title>
</head>
<body>
  <div class="container">
      <ul class="nav nav-tabs">
          <li class="nav-item">
              <a class="nav-link active" data-bs-toggle="tab" href="#centros">Centros Médicos</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#importes">Importes</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#pacientes">Pacientes</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#sesiones">Sesiones</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#configuracion">Configuración</a>
          </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="centros">
            <div class="container shadow-sm p-3 mb-4 bg-light rounded border">
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <label for="name">Nombre:</label>
                        <input type="text" id="txtName" class="form-control" placeholder="Ingrese nombre">
                    </div>
                    <div class="col-md-3">
                        <label for="cboLocalidad">Localidad:</label>
                        <select id="cboLocalidad" class="form-select">
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input class="form-check-input" type="checkbox" value="" id="chkVerInactivos">
                        <label class="form-check-label" for="chkVerInactivos" id="lblVerInactivos">
                          Incluir inactivos
                        </label>
                      </div>
                    <div class="col-md-3 d-flex justify-content-end mt-4">
                        <button id="btnLimpiarCentroMedico" class="btn btn-secondary mx-1">Limpiar</button>
                        <button id="btnNuevoCentroMedico" class="btn btn-primary mx-1">Nuevo</button>
                        <button id="btnFiltrarCentroMedico" class="btn btn-primary mx-1 disabled" >Buscar</button>
                    </div>
                </div>
            </div>            
            
              <table id="tblCentrosMedicos" class="table table-hover">
              </table>
               <!-- Contenedor de paginación -->
              <nav id="pagination" class="d-flex justify-content-center"></nav>
          </div>

          <!-- TAB IMPORTES -->
          <div class="tab-pane fade" id="importes">
            
          </div>

          <!-- TAB PACIENTES -->
          <div class="tab-pane fade" id="pacientes">
              <h1>Lista de Pacientes</h1>
          </div>
      </div>
  </div>
  <div class="modal fade" id="confirmarInactivacionModal" tabindex="-1" aria-labelledby="confirmarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">¿Inactivar centro médico?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          Esta acción cambiará el estado del centro médico a inactivo.
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="btnCancelarInactivacion" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="btnConfirmarInactivacion">Confirmar</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="helpers.js"></script>
  <script type="module" src="index.js"></script>
</body>

</html>
