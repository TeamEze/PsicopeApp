<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>PsicopeApp</title>
</head>
<body>
  <div class="container">
      <ul class="nav nav-tabs">
          <li class="nav-item">
              <a class="nav-link active" data-bs-toggle="tab" href="#centros">Centros Médicos</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#importes">Importes</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#pacientes">Pacientes</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#sesiones">Sesiones</a>
          </li>
          <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#configuracion">Configuración</a>
          </li>
      </ul>

      <div class="tab-content">
          <!-- TAB CENTROS MÉDICOS -->
          <div class="tab-pane fade show active" id="centros">
              <div class="form-group mt-3">
                  <label for="name">Nombre:</label>
                  <input type="text" id="name" class="form-control mb-2" placeholder="Ingrese nombre">
                  <label for="location">Localidad:</label>
                  <select id="location" class="form-select mb-2">
                      <option value="">Seleccione Localidad</option>
                      <option>Morón</option>
                      <option>Castelar</option>
                  </select>
                  <button class="btn btn-secondary">Limpiar</button>
                  <button class="btn btn-secondary">Nuevo</button>
                  <button class="btn btn-primary">Buscar</button>
              </div>
              <table id="tblSesiones" class="table table-striped table-hover">
              </table>
               <!-- Contenedor de paginación -->
              <nav id="pagination"></nav>
          </div>

          <!-- TAB IMPORTES -->
          <div class="tab-pane fade" id="importes">
              <h1>Aquí va la grilla de historiales</h1>
          </div>

          <!-- TAB PACIENTES -->
          <div class="tab-pane fade" id="pacientes">
              <h1>Lista de Pacientes</h1>
          </div>
      </div>
  </div>
  <button id="btnCrearCentroMedico">Crear Centro Médico</button>
  <button id="btnFiltrarCentroMedico">Filtrar Centro Médico</button>
  <script src="../../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>
  <script src="helpers.js"></script>
</body>
</html>
