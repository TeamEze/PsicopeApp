<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Centro Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            margin: 20px auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
        }
        .form-control, .form-select {
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Nuevo Centro Médico</h3>
        <form id="nuevoCentroMedico">
            <label>Nombre</label>
            <input type="text" class="form-control" placeholder="Nombre" id="nombre" required>
            <label>Dirección</label>
            <input type="text" class="form-control" placeholder="Dirección" id="direccion" required>
            <label>Localidad</label>
            <select class="form-select" id="localidad" required>
                <option>Morón</option>
                <option>Castelar</option>
                <option>Haedo</option>
            </select>
            <label>Teléfono Contacto</label>
            <input type="text" class="form-control" placeholder="Teléfono" id="telefono" required>
            <label>Persona Contacto</label>
            <input type="text" class="form-control" placeholder="Contacto" id="contacto" required>
            <label>Mail</label>
            <input type="email" class="form-control" placeholder="Email" id="email" required>
            <label>Duración Sesión</label>
            <input type="number" class="form-control" placeholder="Duración" id="duracion" required>
            <div class="d-flex justify-content-between mt-3">
                <button type="button" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
